version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    ignore:
      # FluentAssertions 7+ is under a commercial license.
      - dependency-name: FluentAssertions
        update-types: ['version-update:semver-major']
    groups:
      nuget:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
